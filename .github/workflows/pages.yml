name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - name: Check official release
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 scripts/check-upstream.py
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm run build
      - name: Fetch matching public upstream files
        run: npm run snapshot
      - name: Check plugin bridge against the downloaded client
        run: ASTROFLUX_BUNDLE=dist/upstream/astroflux.js node --test tests/patch.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
